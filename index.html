<!DOCTYPE html>

<head>

    <title>Khu vườn của những chú chó - Bản Nâng Cấp</title>
    <link rel="stylesheet" href="css/style.css">

<body>

    <!-- Khung hiển thị chính -->
    <div id="main-container">
        <span id="main-text">Di chuột hoặc dùng phím Tab chọn một chú chó bên dưới.</span>
    </div>

    <!-- Danh sách 6 ảnh nhỏ -->
    <div class="thumbnail-list">
        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400"

        <img src="https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=400"

        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=400"

        <img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=400"

        <img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d?w=400"

        <img src="https://images.unsplash.com/photo-1477884213360-7e9d7dcc1e48?w=400"
